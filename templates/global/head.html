{% load static tailwind_tags %}
<title>Portfólio Pessoal</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Tailwind & DaisyUI -->
<script src="https://cdn.tailwindcss.com"></script>
{% tailwind_css %}
<link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet" type="text/css" />

<style>
  :root {
    --font-code: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

    --bg-deep: #05070c;
    --bg-base: #090d16;
    --bg-card: #0e1422;
    --bg-card-hover: #131b2e;
    --bg-terminal: #070a12;

    --border-subtle: #192236;
    --border-bright: #2b3957;

    --neon-green: #00ffaa;
    --neon-cyan: #00f0ff;
    --accent-green: #10b981;

    --text-main: #f3f6fc;
    --text-muted: #94a3b8;
    --text-dim: #64748b;

    --radius-sm: 6px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-full: 9999px;
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
    color-scheme: dark;
  }

  body {
    background-color: var(--bg-deep) !important;
    background-image: 
      linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px) !important;
    background-size: 40px 40px, 40px 40px !important;
    background-position: 20px 20px, 20px 20px !important;
    color: var(--text-main) !important;
    font-family: var(--font-sans) !important;
    min-height: 100vh;
    line-height: 1.6;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.1) 0px,
      rgba(0, 0, 0, 0.1) 1px,
      transparent 1px,
      transparent 2px
    );
    z-index: 9999;
    opacity: 0.4;
  }

  ::selection {
    background: var(--neon-green);
    color: #000;
  }

  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: var(--bg-deep);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--border-bright);
    border-radius: var(--radius-full);
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--accent-green);
  }

  :focus-visible {
    outline: 2px solid var(--accent-green);
    outline-offset: 3px;
  }

  .container-main {
    width: 100%;
    max-width: 1060px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  .nav-wrapper {
    position: sticky;
    top: 1rem;
    z-index: 100;
    display: flex;
    justify-content: center;
    width: 100%;
    margin-bottom: 1.5rem;
  }

  .nav-dock {
    background: rgba(9, 13, 22, 0.9);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius-full);
    padding: 0.35rem 0.5rem;
    display: flex;
    gap: 0.35rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .nav-item {
    font-family: var(--font-code);
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-full);
    padding: 0.5rem 1.2rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    transition: all 0.2s ease;
    text-decoration: none;
    user-select: none;
  }

  .nav-item:hover {
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.04);
  }

  .nav-item.active {
    color: var(--neon-green);
    background: #161b22;
    border-color: var(--border-bright);
    font-weight: 600;
  }

  .hero-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 2.5rem;
    display: flex;
    flex-direction: column-reverse;
    gap: 2.5rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  @media (min-width: 768px) {
    .hero-card {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }
  }

  .hero-text-content,
  .hero-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    text-align: left !important;
    align-items: flex-start !important;
    justify-content: flex-start !important;
    max-width: none !important;
    padding: 0 !important;
  }

  .hero-title {
    font-size: 2.3rem;
    line-height: 1.2;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-align: left !important;
  }

  .hero-title .highlight {
    color: var(--neon-green);
  }

  .hero-description {
    color: #cbd5e1;
    font-size: 1.05rem;
    line-height: 1.75;
    text-align: justify !important;
  }

  .hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-top: 0.5rem;
    justify-content: flex-start !important;
    width: 100%;
  }

  .btn-cyber {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    font-family: var(--font-code);
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-main);
    background: var(--bg-terminal);
    border: 1px solid var(--border-bright);
    padding: 0.6rem 1.1rem;
    border-radius: var(--radius-md);
    text-decoration: none;
    transition: all 0.2s ease;
    cursor: pointer;
  }

  .btn-cyber:hover {
    border-color: var(--accent-green);
    color: var(--neon-green);
    transform: translateY(-2px);
  }

  .hero-avatar-wrap {
    flex-shrink: 0;
    display: flex;
    justify-content: center;
  }

  .avatar-cyber-frame {
    width: 180px;
    height: 180px;
    border-radius: var(--radius-lg);
    border: 2px solid var(--border-bright);
    background: var(--bg-terminal);
    overflow: hidden;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
    transition: border-color 0.2s ease;
  }

  @media (min-width: 640px) {
    .avatar-cyber-frame {
      width: 210px;
      height: 210px;
    }
  }

  .avatar-cyber-frame:hover {
    border-color: var(--accent-green);
  }

  .avatar-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--neon-green);
    background: #080d1a;
    font-family: var(--font-code);
    text-align: center;
    padding: 1rem;
  }

  .section-title {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 1.25rem;
    font-family: var(--font-sans);
  }

  .tech-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 0.85rem;
  }

  .tech-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 0.85rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  .tech-card:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent-green);
    transform: translateY(-2px);
  }

  .tech-icon {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tech-name {
    font-family: var(--font-code);
    font-size: 0.85rem;
    font-weight: 600;
    color: #e2e8f0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .projects-container {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .project-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  @media (min-width: 800px) {
    .project-card {
      flex-direction: row;
      min-height: 240px;
    }
  }

  .project-card:hover {
    border-color: var(--accent-green);
    transform: translateY(-2px);
  }

  .project-preview {
    background: var(--bg-terminal);
    border-bottom: 1px solid var(--border-subtle);
    padding: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  @media (min-width: 800px) {
    .project-preview {
      width: 36%;
      flex-shrink: 0;
      border-bottom: none;
      border-right: 1px solid var(--border-subtle);
    }
  }

  .project-info {
    padding: 1.5rem 1.75rem;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 1.25rem;
  }

  .project-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.01em;
    margin-bottom: 0.5rem;
  }

  .project-desc {
    font-size: 0.9rem;
    color: var(--text-muted);
    line-height: 1.6;
    text-align: justify;
  }

  .project-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
  }

  .tag-badge {
    font-family: var(--font-code);
    font-size: 0.72rem;
    padding: 0.2rem 0.55rem;
    border-radius: var(--radius-sm);
    background: #161b22;
    border: 1px solid rgba(16, 185, 129, 0.2);
    color: var(--neon-green);
  }

  .project-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 1rem;
    border-top: 1px solid var(--border-subtle);
  }

  .btn-detail {
    font-family: var(--font-code);
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--neon-green);
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    padding: 0.35rem 0.6rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    transition: all 0.2s ease;
    text-decoration: none;
  }

  .btn-detail:hover {
    color: #ffffff;
    background: #161b22;
    border-color: var(--border-bright);
  }

  .link-subtle {
    color: var(--text-muted);
    font-size: 0.82rem;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    transition: color 0.2s ease;
  }

  .link-subtle:hover {
    color: var(--neon-green);
  }

  .detail-view-container {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .btn-back {
    font-family: var(--font-code);
    font-size: 0.82rem;
    font-weight: 600;
    background: #161b22;
    border: 1px solid var(--border-bright);
    color: var(--text-main);
    padding: 0.5rem 1.1rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    transition: all 0.2s ease;
    width: fit-content;
    text-decoration: none;
  }

  .btn-back:hover {
    border-color: var(--accent-green);
    color: var(--neon-green);
    transform: translateX(-3px);
  }

  .project-detail-panel {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 1.8rem;
    display: flex;
    flex-direction: column;
    gap: 1.8rem;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  }

  @media (min-width: 640px) {
    .project-detail-panel {
      padding: 2.5rem;
      gap: 2rem;
    }
  }

  .detail-carousel-box {
    width: 100%;
    background: var(--bg-terminal);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius-md);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.5rem;
    box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.7);
  }

  @media (min-width: 640px) {
    .detail-carousel-box {
      padding: 1rem;
    }
  }

  .detail-carousel-display {
    width: 100%;
    height: 450px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background: transparent;
  }

  @media (min-width: 640px) {
    .detail-carousel-display {
      height: 550px;
    }
  }

  .project-image {
    max-width: 100%;
    height: auto;
    max-height: 450px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
    border-radius: var(--radius-sm);
    transition: opacity 0.2s ease;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }

  @media (min-width: 640px) {
    .project-image {
      max-height: 550px;
    }
  }

  .detail-carousel-controls {
    display: flex;
    flex-wrap: wrap;
    width: 100%;
    justify-content: center;
    align-items: center;
    gap: 0.5rem;
    padding: 1rem 0.5rem 0.5rem;
  }

  .slide-num-btn {
    font-family: var(--font-code);
    font-size: 0.8rem;
    font-weight: 600;
    background: #161b22;
    border: 1px solid var(--border-subtle);
    color: var(--text-muted);
    width: 34px;
    height: 34px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .slide-num-btn:hover {
    border-color: var(--accent-green);
    color: var(--neon-green);
  }

  .slide-num-btn.active {
    background: #1c232d;
    color: var(--neon-green);
    border-color: var(--accent-green);
  }

  .detail-title-row {
    border-bottom: 1px solid var(--border-subtle);
    padding-bottom: 1rem;
  }

  .detail-title-row h1 {
    font-size: 1.8rem;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.02em;
  }

  .detail-block-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--neon-green);
    margin-bottom: 0.5rem;
  }

  .detail-block-text {
    color: #cbd5e1;
    font-size: 0.95rem;
    line-height: 1.8;
    text-align: justify;
    white-space: pre-line;
  }

  .detail-links-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.85rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border-subtle);
  }

  .education-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .education-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 1.25rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    transition: border-color 0.2s ease;
  }

  .education-card:hover {
    border-color: var(--accent-green);
  }

  .education-header {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  @media (min-width: 600px) {
    .education-header {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }
  }

  .education-title-group {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.5rem;
  }

  .education-course {
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
  }

  .education-institution {
    font-size: 0.95rem;
    color: var(--text-muted);
    font-weight: 500;
  }

  .education-period {
    font-family: var(--font-code);
    font-size: 0.8rem;
    color: var(--neon-green);
    background: #161b22;
    border: 1px solid rgba(16, 185, 129, 0.2);
    padding: 0.25rem 0.65rem;
    border-radius: var(--radius-sm);
    width: fit-content;
  }
</style>
