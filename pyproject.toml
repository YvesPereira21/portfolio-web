[project]
name = "meu-portfolio"
version = "0.1.0"
description = ""
authors = [
    {name = "YvesPereira21"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (>=6.1,<7.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "dj-database-url (>=3.1.2,<4.0.0)",
    "django-tailwind[cookiecutter,honcho,reload] (>=4.5.0,<5.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "cloudinary (>=1.45.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "portfolio"}, {include = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
